version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk_dev
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - helpdesk_postgres_data:/var/lib/postgresql/data

volumes:
  helpdesk_postgres_data: